# ============================================================
# 测试环境配置：H2 内存数据库（MySQL 兼容模式）
# Flyway 直接在 H2 上执行 V1/V2 迁移，保证测试库结构与生产一致
# ============================================================
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    # MODE=MySQL 兼容 MySQL 语法；DATABASE_TO_LOWER 使未加引号的标识符与反引号建表名匹配
    url: jdbc:h2:mem:ytt_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 占位邮件配置：仅用于让 MailSender 自动配置注册 JavaMailSender，
  # 测试不会真正连接/发送（EmailLoginTest 中 MailService 为 MockBean）
  mail:
    host: localhost
    port: 3025

logging:
  level:
    root: warn
    com.ytt: info
