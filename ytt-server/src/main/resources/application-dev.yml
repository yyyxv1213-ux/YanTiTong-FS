# ============================================================
# 开发环境配置
# ============================================================
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ytt_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20        # 最大连接数
      minimum-idle: 5              # 最小空闲连接
      connection-timeout: 30000    # 获取连接超时(ms)
      idle-timeout: 600000         # 空闲连接存活(ms)
      max-lifetime: 1800000        # 连接最大生命周期(ms)
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 邮件服务（QQ 邮箱 SMTP）：账号与授权码一律通过环境变量注入，禁止在配置文件中写明文
  # 本机联调请先设置环境变量：
  #   PowerShell: $env:MAIL_USERNAME="你的邮箱@qq.com"; $env:MAIL_PASSWORD="SMTP授权码"
  # 未设置时账号/授权码为空，应用可正常启动，仅邮件验证码发送会返回 50002
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    com.ytt: debug
    org.springframework.security: info

# 开发/测试环境放宽限流阈值（×2），便于自动化测试密集调用；
# 生产环境不配置该项，注解 capacity 原样生效
security:
  rate-limit:
    multiplier: 2
