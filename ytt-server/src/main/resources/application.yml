# ============================================================
# 公共配置：所有环境共享，环境差异见 application-{env}.yml
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ytt-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 认证配置
jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 覆盖
  secret: ytt-dev-secret-key-please-override-in-production-0123456789abcdef
  access-expire: 7200        # 访问令牌有效期（秒）2小时
  refresh-expire: 604800     # 刷新令牌有效期（秒）7天
  header: Authorization
  prefix: "Bearer "

# 接口限流配置（内存实现，生产可替换 Redis 分布式限流）
rate-limit:
  login:
    capacity: 5      # 登录接口：每分钟 5 次
    period: 60
  default:
    capacity: 120
    period: 60
